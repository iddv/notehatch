name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest tests.test_notehatch
      - name: Acceptance tests
        run: |
          python -m pip install pytest
          if [ -d tests/acceptance ]; then python -m pytest tests/acceptance; fi
